<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kółko i Krzyżyk</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.5s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-size: 400% 400%;
            padding: 15px 10px 80px 10px;
            position: relative;
            overflow-x: hidden;
        }

        body.theme-friendly { background: linear-gradient(-45deg, #e3f2fd, #bbdefb, #e0f2f1, #e8eaf6); animation: gradientAnim 12s ease infinite; }
        body.theme-friendly h1 { color: #1e3a8a; }
        body.theme-friendly .main-box, body.theme-friendly .profile-sidebar { background: rgba(255, 255, 255, 0.95); box-shadow: 0 10px 30px rgba(30, 58, 138, 0.15); }
        body.theme-friendly footer { color: #64748b; } body.theme-friendly footer a { color: #1e3a8a; }
        body.theme-friendly th { background-color: #3b82f6; color: white; }
        body.theme-friendly tr:nth-child(even) { background-color: #f1f5f9; }

        body.theme-aggressive { background: linear-gradient(-45deg, #1a0505, #450a0a, #0f0505, #2a0808); animation: gradientAnim 6s ease infinite; }
        body.theme-aggressive h1 { color: #f43f5e; text-shadow: 0 0 15px rgba(244, 63, 94, 0.6); }
        body.theme-aggressive .main-box, body.theme-aggressive .profile-sidebar { background: rgba(20, 10, 10, 0.95); border: 1px solid #f43f5e; box-shadow: 0 10px 40px rgba(244, 63, 94, 0.3); color: #f3f4f6; }
        body.theme-aggressive .player-setup-box { background: rgba(40, 20, 20, 0.8); border-color: #5c1d24; }
        body.theme-aggressive label { color: #e5e7eb !important; }
        body.theme-aggressive #status, body.theme-aggressive .scoreboard { background: #281414; color: #fff; }
        body.theme-aggressive footer { color: #f43f5e; } body.theme-aggressive footer a { color: #fda4af; }
        body.theme-aggressive table, body.theme-aggressive th, body.theme-aggressive td { border-color: #5c1d24; }
        body.theme-aggressive th { background-color: #991b1b; color: white; }
        body.theme-aggressive tr:nth-child(even) { background-color: rgba(244, 63, 94, 0.1); }

        body.theme-competition { background: linear-gradient(-45deg, #2e1065, #4c1d95, #0f172a, #3b0764); animation: gradientAnim 9s ease infinite; }
        body.theme-competition h1 { color: #f59e0b; text-shadow: 0 0 12px rgba(245, 158, 11, 0.5); }
        body.theme-competition .main-box, body.theme-competition .profile-sidebar { background: rgba(30, 27, 75, 0.95); border: 1px solid #8b5cf6; box-shadow: 0 10px 40px rgba(139, 92, 246, 0.4); color: #f3f4f6; }
        body.theme-competition .player-setup-box { background: rgba(49, 46, 129, 0.8); border-color: #4338ca; }
        body.theme-competition label { color: #e5e7eb !important; }
        body.theme-competition #status, body.theme-competition .scoreboard { background: #312e81; color: #fff; }
        body.theme-competition footer { color: #a78bfa; } body.theme-competition footer a { color: #f59e0b; }
        body.theme-competition table, body.theme-competition th, body.theme-competition td { border-color: #4338ca; }
        body.theme-competition th { background-color: #6d28d9; color: #f59e0b; }
        body.theme-competition tr:nth-child(even) { background-color: rgba(139, 92, 246, 0.15); }

        @keyframes gradientAnim { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .bg-character { position: absolute; font-size: 2.5rem; user-select: none; pointer-events: none; z-index: 1; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15)); animation: floatAnimation 6s ease-in-out infinite alternate; }
        .char1 { top: 5%; left: 3%; animation-duration: 5s; } .char2 { top: 85%; left: 4%; animation-duration: 7s; animation-delay: 1s; }
        .char3 { top: 6%; right: 3%; animation-duration: 6s; animation-delay: 0.5s; } .char4 { top: 80%; right: 4%; animation-duration: 8s; animation-delay: 1.5s; }
        @keyframes floatAnimation { 0% { transform: translateY(0px); } 100% { transform: translateY(-15px); } }

        h1 { font-size: 2.5rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; text-align: center; z-index: 5; padding: 0 10px; }

        .app-layout { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 1000px; align-items: center; justify-content: center; z-index: 5; }

        .profile-sidebar { width: 100%; max-width: 450px; padding: 15px; border-radius: 15px; display: none; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.1); border: 2px solid rgba(30, 58, 138, 0.1); }
        .sidebar-avatar { font-size: 3rem; background: #e2e8f0; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin-bottom: 10px; border: 3px solid #1e3a8a; }
        .sidebar-info h3 { font-size: 1.2rem; color: #1e3a8a; margin-bottom: 2px; }
        .sidebar-info .player-id { font-size: 0.85rem; color: #64748b; font-weight: bold; margin-bottom: 10px; }
        .sidebar-stats { background: rgba(255,255,255,0.6); padding: 8px; width: 100%; border-radius: 8px; margin-bottom: 15px; border: 1px solid #cbd5e1; }
        .sidebar-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .sidebar-actions button:last-child { grid-column: span 2; }

        .main-box { padding: 20px; border-radius: 15px; width: 100%; max-width: 450px; display: none; }
        .auth-container { display: block; margin: 0 auto; }

        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.9rem; color: #4b5563; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; background: white; color: #000; }

        .btn-primary { background-color: #1e3a8a; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 25px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .btn-link { background: none; border: none; color: #3b82f6; font-weight: bold; cursor: pointer; text-decoration: underline; margin-top: 10px; font-size: 0.9rem; }
        
        .sidebar-btn { border: none; padding: 10px; font-size: 0.85rem; font-weight: bold; border-radius: 8px; cursor: pointer; color: white; width: 100%; text-align: center; }
        .btn-sidebar-edit { background-color: #f59e0b; } .btn-sidebar-friends { background-color: #3b82f6; } .btn-sidebar-logout { background-color: #ef4444; }

        .player-setup-box { padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; background: rgba(255,255,255,0.4); }
        .radio-group { display: flex; justify-content: center; gap: 10px; margin: 6px 0; }
        .radio-label { font-size: 0.85rem; font-weight: bold; cursor: pointer; padding: 8px 12px; border: 2px solid #cbd5e1; border-radius: 8px; background: white; color: #000; text-align: center; flex: 1; }
        #p1-choose-x:checked + .radio-label-p1-x, #p2-choose-x:checked + .radio-label-p2-x { border-color: #ef4444; background-color: #fef2f2; color: #ef4444; }
        #p1-choose-o:checked + .radio-label-p1-o, #p2-choose-o:checked + .radio-label-p2-o { border-color: #22c55e; background-color: #f0fdf4; color: #22c55e; }
        .radio-group input { display: none; }
        .error-text { color: #ef4444; font-weight: bold; margin-bottom: 12px; display: none; text-align: center; font-size: 0.9rem; }

        .online-panel { background: rgba(59, 130, 246, 0.1); border: 2px solid #3b82f6; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .share-link-box { background: white; color: #000; border: 1px solid #cbd5e1; padding: 8px; border-radius: 6px; font-size: 0.8rem; margin-top: 6px; word-break: break-all; cursor: pointer; font-weight: bold; }
        .connected-players-info { margin: 10px 0; padding: 8px; background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; border-radius: 6px; font-size: 0.85rem; font-weight: bold; color: #16a34a; }

        table { width: 100%; border-collapse: collapse; background: white; color: #000; border-radius: 8px; overflow: hidden; border: 1px solid #cbd5e1; margin-top: 8px; }
        th, td { padding: 6px 8px; text-align: center; font-size: 0.85rem; border-bottom: 1px solid #cbd5e1; }

        /* --- PLANSZA GRY --- */
        .game-container { flex-direction: column; align-items: center; width: 100%; }
        .scoreboard { display: flex; gap: 20px; padding: 8px 15px; background: white; border-radius: 15px; margin-bottom: 12px; font-size: 1rem; font-weight: bold; color: #333; width: 100%; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .score-box span { display: block; font-size: 1.5rem; margin-top: 2px; }
        #status { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #333; background: white; padding: 6px 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; width: 100%; }
        
        .board-wrapper { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1 / 1; }
        .board { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            border: 6px solid #000000; 
            background-color: #000000; 
            gap: 5px; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); 
            width: 100%; height: 100%; touch-action: manipulation;
        }
        .cell { background-color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: calc(2rem + 3vw); max-font-size: 3.5rem; font-weight: bold; cursor: pointer; user-select: none; color: #000; }
        .cell.X { color: #ef4444; } .cell.O { color: #22c55e; }

        .next-round-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); color: white; border-radius: 12px; flex-direction: column; justify-content: center; align-items: center; z-index: 15; font-size: 2rem; font-weight: bold; }
        .next-round-overlay span { font-size: 1.1rem; margin-top: 8px; color: #94a3b8; }

        /* --- MODALE --- */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 100; color: #000; padding: 10px; }
        .popup { background: white; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); width: 100%; max-width: 380px; }
        .animated-winner-sign { font-size: 4.5rem; animation: gifEffect 1.2s ease-in-out infinite alternate; display: inline-block; margin-bottom: 8px; }
        @keyframes gifEffect { 0% { transform: scale(0.9) rotate(-5deg); } 100% { transform: scale(1.1) rotate(5deg); } }
        
        .avatar-selection { display: flex; justify-content: center; gap: 8px; font-size: 2rem; margin: 12px 0; }
        .avatar-opt { cursor: pointer; padding: 4px; border-radius: 50%; border: 2px solid transparent; }
        .avatar-opt.selected { border-color: #3b82f6; background: #e2e8f0; }
        .friends-list { max-height: 120px; overflow-y: auto; margin-top: 8px; text-align: left; }
        .friend-item { display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; align-items: center; }

        footer { position: absolute; bottom: 15px; left: 0; width: 100%; text-align: center; font-size: 0.8rem; font-weight: 500; z-index: 10; padding: 0 5px; }
        footer a { text-decoration: none; font-weight: bold; }
        .confetti { position: absolute; width: 8px; height: 8px; z-index: 99; pointer-events: none; animation: confettiFall 4s linear infinite; }
        @keyframes confettiFall { 0% { transform: translateY(-30px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        @media (min-width: 768px) {
            body { padding-top: 40px; } h1 { font-size: 3.2rem; margin-bottom: 30px; }
            .app-layout { flex-direction: row; align-items: flex-start; }
            .profile-sidebar { width: 280px; padding: 20px; }
            .sidebar-avatar { width: 85px; height: 85px; font-size: 4rem; }
            .sidebar-info h3 { font-size: 1.3rem; }
            .sidebar-actions { flex-direction: column; display: flex; }
            .sidebar-actions button:last-child { grid-column: auto; }
            .main-box { width: 480px; padding: 25px; }
            th, td { padding: 8px 12px; font-size: 0.95rem; }
            .cell { font-size: 3.5rem; } .scoreboard { font-size: 1.1rem; } .score-box span { font-size: 1.8rem; } #status { font-size: 1.3rem; } .bg-character { font-size: 3.5rem; }
        }
    </style>
</head>
<body class="theme-friendly" id="game-body">
    <script>
        let _supabase = null;
        let loggedUser = null;
        
        // --- INICJALIZACJA ---
        try {
            _supabase = supabase.createClient(
                "https://lmetjyrsbumovtflgwzn.supabase.co", 
                "sb_publishable_J0cj28Wn6LnITRboTif2ZQ_u9YPMS5K"
            );
            console.log("Supabase zainicjalizowane!");
        } catch (e) { console.error("Błąd init:", e); }

        // --- ZMIENNE GRY ---
        let player1 = { name: "Gracz 1", sign: "X", score: 0 };
        let player2 = { name: "Gracz 2", sign: "O", score: 0 };
        let currentPlayer = 'X', gameState = ["","","","","","","","",""], isGameActive = true;
        let currentRoundNumber = 1, maxWinningRounds = 3, confettiInterval;
        let isMultiplayerOnline = false, peer = null, netConnection = null, amIRoomHost = false, myOnlineSign = 'X';
        const cells = document.querySelectorAll('.cell');
        const winningConditions = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        // --- BEZPIECZNIK PRZYCISKÓW ---
        document.addEventListener('DOMContentLoaded', () => {
            const btnEdit = document.getElementById('btn-side-edit');
            if(btnEdit) btnEdit.addEventListener('click', () => document.getElementById('edit-profile-overlay').style.display = 'flex');
            
            const btnFriends = document.getElementById('btn-side-friends');
            if(btnFriends) btnFriends.addEventListener('click', () => { document.getElementById('friends-overlay').style.display = 'flex'; renderFriends(); });
            
            const btnLogout = document.getElementById('btn-side-logout');
            if(btnLogout) btnLogout.addEventListener('click', () => { loggedUser = null; if(peer) peer.destroy(); refreshUserSession(); });

            const resetBtn = document.getElementById('reset-btn');
            if(resetBtn) resetBtn.addEventListener('click', () => { if(isMultiplayerOnline && netConnection) netConnection.close(); backToMenu(); });
            
            cells.forEach(c => c.addEventListener('click', handleCellClick));
            refreshUserSession();
        });

        // --- POPRAWIONE FUNKCJE ---
        function updateStatusText() {
            const activePlayerName = player1.sign === currentPlayer ? player1.name : player2.name;
            const styleClass = currentPlayer === 'X' ? 'player-x' : 'player-o';
            let turnAlert = isMultiplayerOnline ? (myOnlineSign === currentPlayer ? " (Twój ruch)" : " (Ruch rywala)") : "";
            document.getElementById('status').innerHTML = `Tura: <strong>${activePlayerName.toUpperCase()}</strong> (<span class="${styleClass}">${currentPlayer}</span>)${turnAlert}`;
        }

        function checkResult() {
            let roundWon = false;
            for(let i=0; i<winningConditions.length; i++) {
                const cond = winningConditions[i];
                if(gameState[cond[0]] !== "" && gameState[cond[0]] === gameState[cond[1]] && gameState[cond[1]] === gameState[cond[2]]) { 
                    roundWon = true; break; 
                }
            }

            if(roundWon) {
                isGameActive = false;
                if(player1.sign === currentPlayer) player1.score++; else player2.score++;
                refreshScoreboard();
                
                if (player1.score === maxWinningRounds || player2.score === maxWinningRounds) {
                    const winner = player1.score === maxWinningRounds ? player1 : player2;
                    if (isMultiplayerOnline) {
                        if (amIRoomHost) handleFinalGameVictory(winner);
                        else showVictoryPopupOnly(winner);
                    } else {
                        handleFinalGameVictory(winner);
                    }
                } else {
                    triggerRoundTransition(player1.sign === currentPlayer ? player1.name : player2.name);
                }
                return;
            }
            if(!gameState.includes("")) { isGameActive = false; triggerRoundTransition("Remis"); }
            else { currentPlayer = currentPlayer === 'X' ? 'O' : 'X'; updateStatusText(); }
        }

        async function handleFinalGameVictory(winner) {
            if(_supabase && winner.name.toLowerCase() === loggedUser?.username) {
                await _supabase.from('users').update({ wins: loggedUser.wins + 1 }).eq('username', loggedUser.username);
            }
            showVictoryPopupOnly(winner);
        }

        function showVictoryPopupOnly(winner) {
            const th = document.getElementById('theme-select').value;
            document.getElementById('popup-symbol').textContent = th === 'aggressive' ? '😈🔥' : th === 'competition' ? '👑🏆' : '🐱🎉';
            document.getElementById('popup-text').innerHTML = `MISTRZ: ${winner.name.toUpperCase()}!`;
            document.getElementById('popup-subtext').innerHTML = `Seria zakończona wynikiem <strong>${player1.score} : ${player2.score}</strong>.`;
            document.getElementById('win-overlay').style.display = 'flex';
            startConfetti();
        }

        const authScreen = document.getElementById('auth-screen');
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const sidebarPanel = document.getElementById('sidebar-panel');
        const bodyEl = document.getElementById('game-body');
        const gameModeSelect = document.getElementById('game-mode-select');
        const onlineSetupBox = document.getElementById('online-setup-box');

        let isRegisterMode = false;
        const authTitle = document.getElementById('auth-title');
        const btnAuthSubmit = document.getElementById('btn-auth-submit');
        const btnAuthToggle = document.getElementById('btn-auth-toggle');
        const authError = document.getElementById('auth-error');
        const authUserIn = document.getElementById('auth-username');
        const authPassIn = document.getElementById('auth-password');

        let player1 = { name: "Gracz 1", sign: "X", score: 0 };
        let player2 = { name: "Gracz 2", sign: "O", score: 0 };
        let currentPlayer = 'X';
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        let currentRoundNumber = 1;
        let maxWinningRounds = 3;
        let confettiInterval;

        let isMultiplayerOnline = false;
        let peer = null;
        let netConnection = null;
        let amIRoomHost = false;
        let myOnlineSign = 'X';

        const cells = document.querySelectorAll('.cell');
        const winningConditions = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        btnAuthToggle.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            authTitle.textContent = isRegisterMode ? "Rejestracja Konta" : "Logowanie";
            btnAuthSubmit.textContent = isRegisterMode ? "Zarejestruj" : "Zaloguj";
            btnAuthToggle.textContent = isRegisterMode ? "Masz konto? Zaloguj się" : "Nie masz konta? Zarejestruj się";
            authError.style.display = 'none';
        });

        // CENTRALNE LOGOWANIE I REJESTRACJA SQL CLOUD
        btnAuthSubmit.addEventListener('click', async () => {
            const username = authUserIn.value.trim();
            const password = authPassIn.value.trim();
            if(!username || !password) { showAuthError("Uzupełnij pola!"); return; }

            if(isRegisterMode) {
                // Sprawdzenie w bazie danych SQL czy nick zajęty
                const { data: existingUser } = await _supabase.from('users').select('username').eq('username', username.toLowerCase()).maybeSingle();
                if(existingUser) { showAuthError("Ta nazwa użytkownika jest już zajęta!"); return; }
                
                // Generowanie unikalnego ID w chmurze SQL
                let uniqueID = Math.floor(1000 + Math.random() * 9000).toString();
                
                // Zapis konta do bazy PostgreSQL
                const { error } = await _supabase.from('users').insert([{ username: username.toLowerCase(), password: password, id: uniqueID, avatar: '🐱', wins: 0 }]);
               if(error) { 
    console.error("Szczegóły błędu:", error); 
    showAuthError("Błąd zapisu: " + (error.message || "Sprawdź polityki RLS!")); 
    return; 
}
                loggedUser = { username: username.toLowerCase(), id: uniqueID, avatar: '🐱', wins: 0 };
                isRegisterMode = false;
                authUserIn.value = ""; authPassIn.value = "";
                refreshUserSession();
                checkUrlParametersForRoom();
            } else {
                // Odczyt z bazy danych SQL
                const { data: user, error } = await _supabase.from('users').select('*').eq('username', username.toLowerCase()).maybeSingle();
                if(user && user.password === password) {
                    loggedUser = user;
                    refreshUserSession();
                    checkUrlParametersForRoom();
                } else { showAuthError("Błędne dane logowania w bazie SQL!"); }
            }
        });

        function showAuthError(msg, color = "#ef4444") {
            authError.textContent = msg; authError.style.color = color; authError.style.display = 'block';
        }

        async function refreshUserSession() {
            if(!loggedUser) {
                authScreen.style.display = 'block'; setupScreen.style.display = 'none'; gameScreen.style.display = 'none'; sidebarPanel.style.display = 'none';
                return;
            }
            authScreen.style.display = 'none'; setupScreen.style.display = 'block'; sidebarPanel.style.display = 'flex';

            // Odśwież dane gracza prosto z bazy SQL
            const { data: user } = await _supabase.from('users').select('*').eq('username', loggedUser.username).single();
            if(user) loggedUser = user;

            document.getElementById('p1-name').value = loggedUser.username.toUpperCase();
            document.getElementById('side-avatar-icon').textContent = loggedUser.avatar;
            document.getElementById('side-username').textContent = loggedUser.username;
            document.getElementById('side-id-val').textContent = `#${loggedUser.id}`;
            document.getElementById('side-wins-val').textContent = loggedUser.wins;
            document.getElementById('my-id-reminder-label').textContent = `Twoje ID dla kolegi: #${loggedUser.id}`;

            updateLeaderboardUI();
        }

        document.getElementById('btn-side-logout').addEventListener('click', () => {
            loggedUser = null; if(peer) peer.destroy(); refreshUserSession();
        });

        // DODAWANIE ZNAJOMYCH PRZEZ ZAPYTANIA SQL (DZIAŁA MIĘDZY PRZEGLĄDARKAMI)
        document.getElementById('btn-add-friend-submit').addEventListener('click', async () => {
            const queryId = document.getElementById('friend-search-input').value.trim();
            const labelErr = document.getElementById('friend-error'); if(!queryId) return;
            
            if(queryId === loggedUser.id) {
                labelErr.textContent = "Nie możesz dodać samego siebie!"; labelErr.style.color = "#ef4444"; labelErr.style.display = 'block'; return;
            }

            // Znajdź gracza o tym ID w chmurze SQL
            const { data: targetUser } = await _supabase.from('users').select('username').eq('id', queryId).maybeSingle();

            if(targetUser) {
                // Sprawdź czy już nie są znajomymi
                const { data: exists } = await _supabase.from('friends').select('*').eq('user_username', loggedUser.username).eq('friend_username', targetUser.username).maybeSingle();
                if(!exists) {
                    await _supabase.from('friends').insert([{ user_username: loggedUser.username, friend_username: targetUser.username }]);
                    labelErr.style.display = 'block'; labelErr.textContent = `Dodano gracza do bazy znajomych!`; labelErr.style.color = "#16a34a";
                    renderFriends();
                } else {
                    labelErr.textContent = "Ten gracz jest już na liście."; labelErr.style.color = "#ef4444"; labelErr.style.display = 'block';
                }
            } else { 
                labelErr.textContent = "Nie znaleziono takiego ID w bazie SQL!"; labelErr.style.color = "#ef4444"; labelErr.style.display = 'block'; 
            }
        });

        async function renderFriends() {
            const container = document.getElementById('friends-list-container'); container.innerHTML = '';
            
            // Pobierz znajomych relacją SQL JOIN
            const { data: friendRows } = await _supabase.from('friends').select('friend_username').eq('user_username', loggedUser.username);
            
            if(!friendRows || friendRows.length === 0) { container.innerHTML = '<p style="font-style:italic; color:#64748b; font-size:0.85rem;">Brak znajomych.</p>'; return; }
            
            for(let row of friendRows) {
                const { data: fData } = await _supabase.from('users').select('*').eq('username', row.friend_username).single();
                if(!fData) continue;
                const div = document.createElement('div'); div.className = 'friend-item';
                div.innerHTML = `<span>${fData.avatar} <strong>${fData.username}</strong> <small style="color:#64748b;">#${fData.id}</small></span> <button onclick="quickInviteOnline('${fData.id}')" style="padding:4px 8px; background:#3b82f6; border:none; color:white; border-radius:4px; font-weight:bold; cursor:pointer; font-size:0.75rem;">Zaproś</button>`;
                container.appendChild(div);
            }
        }

        function quickInviteOnline(id) {
            document.getElementById('friends-overlay').style.display = 'none';
            gameModeSelect.value = "online"; handleGameModeChange();
            document.getElementById('join-room-input').value = id;
        }

        gameModeSelect.addEventListener('change', handleGameModeChange);
        
        function handleGameModeChange() {
            const startBtn = document.getElementById('start-game-btn');
            const guestMsg = document.getElementById('guest-waiting-msg');
            const maxRoundsCont = document.getElementById('max-rounds-container');

            if (gameModeSelect.value === "online") {
                isMultiplayerOnline = true; onlineSetupBox.style.display = "block";
                document.getElementById('p2-box-container').style.display = "none";
                startBtn.style.display = "block"; guestMsg.style.display = "none"; maxRoundsCont.style.display = "block"; 
                initPeerNetwork();
            } else {
                isMultiplayerOnline = false; onlineSetupBox.style.display = "none";
                document.getElementById('p2-box-container').style.display = "block";
                startBtn.style.display = "block"; guestMsg.style.display = "none"; maxRoundsCont.style.display = "block"; 
                document.getElementById('connected-players-box').style.display = "none";
                if (peer) { peer.destroy(); peer = null; }
            }
        }

        document.getElementById('room-link-display').addEventListener('click', function() {
            navigator.clipboard.writeText(this.textContent); alert("Link skopiowany!");
        });

        function initPeerNetwork() {
            if (peer) return;
            document.getElementById('online-status-lbl').textContent = "Łączenie z siecią multiplayer...";
            document.getElementById('online-room-details').style.display = "none";
            document.getElementById('connected-players-box').style.display = "none";

            const roomId = "KIK" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(roomId);

            peer.on('open', (id) => {
                amIRoomHost = true;
                document.getElementById('online-status-lbl').textContent = "Oczekiwanie na rywala online...";
                document.getElementById('online-room-details').style.display = "block";
                document.getElementById('room-id-display').textContent = id;
                const inviteUrl = window.location.origin + window.location.pathname + "?room=" + id;
                document.getElementById('room-link-display').textContent = inviteUrl;
                
                document.getElementById('connected-players-box').style.display = "block";
                document.getElementById('connected-players-list').textContent = `${loggedUser.username} (Host), Oczekiwanie na połączenie...`;
            });

            peer.on('connection', (conn) => { netConnection = conn; setupNetworkListeners(); });
            peer.on('error', (err) => { document.getElementById('online-status-lbl').textContent = "Błąd połączenia z siecią."; });
        }

        document.getElementById('btn-join-room-submit').addEventListener('click', () => {
            const targetRoomId = document.getElementById('join-room-input').value.trim().toUpperCase();
            if(!targetRoomId) return; connectToRoom(targetRoomId);
        });

        function connectToRoom(targetId) {
            if (peer) { peer.destroy(); peer = null; }
            document.getElementById('online-status-lbl').textContent = "Łączenie z pokojem...";
            peer = new Peer();
            peer.on('open', () => { amIRoomHost = false; netConnection = peer.connect(targetId); setupNetworkListeners(); });
            peer.on('error', () => { alert("Błąd dołączania. Pokój nie istnieje."); handleGameModeChange(); });
        }

        function checkUrlParametersForRoom() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam && loggedUser) {
                gameModeSelect.value = "online"; handleGameModeChange();
                setTimeout(() => { connectToRoom(roomParam.toUpperCase()); }, 1000);
            }
        }

        function setupNetworkListeners() {
            const startBtn = document.getElementById('start-game-btn');
            const guestMsg = document.getElementById('guest-waiting-msg');
            const maxRoundsCont = document.getElementById('max-rounds-container');

            netConnection.on('open', () => {
                document.getElementById('online-status-lbl').innerHTML = "🟢 Połączono sieciowo!";
                document.getElementById('join-existing-room-area').style.display = "none";
                
                if (!amIRoomHost) {
                    startBtn.style.display = "none";
                    guestMsg.style.display = "block";
                    maxRoundsCont.style.display = "none"; 
                }
                netConnection.send({ type: 'init-names', name: loggedUser.username });
            });

            netConnection.on('data', (data) => {
                if (data.type === 'init-names') {
                    player1.name = amIRoomHost ? loggedUser.username : data.name;
                    player2.name = amIRoomHost ? data.name : loggedUser.username;
                    
                    document.getElementById('connected-players-box').style.display = "block";
                    if(amIRoomHost) {
                        document.getElementById('connected-players-list').innerHTML = `1. ${player1.name} (Host) | <span style="color:#2563eb;">2. ${player2.name} (Połączony)</span>`;
                    } else {
                        document.getElementById('connected-players-list').innerHTML = `1. ${player2.name} (Host) | <span style="color:#2563eb;">2. ${player1.name} (Ty)</span>`;
                    }
                }
                
                if (data.type === 'launch-match-broadcast') {
                    maxWinningRounds = data.rounds;
                    player1.name = data.p1Name;
                    player2.name = data.p2Name;
                    if (!amIRoomHost) {
                        myOnlineSign = data.hostSign === 'X' ? 'O' : 'X';
                        player1.sign = myOnlineSign; player2.sign = data.hostSign;
                    } else {
                        player1.sign = myOnlineSign; player2.sign = myOnlineSign === 'X' ? 'O' : 'X';
                    }
                    launchGameEngine();
                }
                if (data.type === 'move') { executeMoveOnGrid(data.index, data.sign); }
                if (data.type === 'rematch') { executeRematchReset(); }
            });

            netConnection.on('close', () => { alert("Rozłączono z przeciwnikiem."); backToMenu(); });
        }

        document.getElementById('start-game-btn').addEventListener('click', () => {
            if (isMultiplayerOnline) {
                if (!netConnection) { alert("Brak gracza w pokoju!"); return; }
                
                player1.name = loggedUser.username;
                myOnlineSign = document.querySelector('input[name="p1-sign"]:checked').value;
                maxWinningRounds = parseInt(document.getElementById('max-rounds').value);
                
                netConnection.send({ 
                    type: 'launch-match-broadcast', hostSign: myOnlineSign, rounds: maxWinningRounds, p1Name: player1.name, p2Name: player2.name 
                });
                
                player1.sign = myOnlineSign; player2.sign = myOnlineSign === 'X' ? 'O' : 'X';
                launchGameEngine();
                return;
            }
            
            player1.name = loggedUser.username;
            player2.name = document.getElementById('p2-name').value.trim() || "Gracz 2";
            player1.sign = document.querySelector('input[name="p1-sign"]:checked').value;
            player2.sign = document.querySelector('input[name="p2-sign"]:checked').value;
            maxWinningRounds = parseInt(document.getElementById('max-rounds').value);

            if(player1.sign === player2.sign) { document.getElementById('error-msg').style.display = 'block'; return; }
            document.getElementById('error-msg').style.display = 'none';
            launchGameEngine();
        });

        function launchGameEngine() {
            player1.score = 0; player2.score = 0; currentRoundNumber = 1;
            document.getElementById('score-p1-name').textContent = player1.name.toUpperCase();
            document.getElementById('score-p2-name').textContent = player2.name.toUpperCase();
            document.getElementById('score-p1-val').className = player1.sign === 'X' ? 'player-x' : 'player-o';
            document.getElementById('score-p2-val').className = player2.sign === 'X' ? 'player-x' : 'player-o';
            refreshScoreboard();
            currentPlayer = 'X'; setupScreen.style.display = 'none'; gameScreen.style.display = 'flex'; updateStatusText();
        }

        function refreshScoreboard() {
            document.getElementById('score-p1-val').textContent = player1.score;
            document.getElementById('score-p2-val').textContent = player2.score;
        }

        function updateStatusText() {
    const activePlayerName = player1.sign === currentPlayer ? player1.name : player2.name;
    const styleClass = currentPlayer === 'X' ? 'player-x' : 'player-o';
    
    let turnAlert = "";
    if (isMultiplayerOnline) {
        
        turnAlert = (myOnlineSign === currentPlayer) ? " (Twój ruch)" : " (Ruch rywala)";
    }
    
    document.getElementById('status').innerHTML = `Tura: <strong>${activePlayerName.toUpperCase()}</strong> (<span class="${styleClass}">${currentPlayer}</span>)${turnAlert}`;
}

        function handleCellClick(e) {
            const cell = e.target; const idx = parseInt(cell.getAttribute('data-index'));
            if(gameState[idx] !== "" || !isGameActive) return;
            if (isMultiplayerOnline && currentPlayer !== myOnlineSign) return;

            if (isMultiplayerOnline) { netConnection.send({ type: 'move', index: idx, sign: myOnlineSign }); }
            executeMoveOnGrid(idx, currentPlayer);
        }

        function executeMoveOnGrid(idx, sign) {
            gameState[idx] = sign; cells[idx].textContent = sign; cells[idx].classList.add(sign); checkResult();
        }

        function checkResult() {
           let roundWon = false;
    for(let i=0; i<winningConditions.length; i++) {
        const cond = winningConditions[i];
        if(gameState[cond[0]] !== "" && gameState[cond[0]] === gameState[cond[1]] && gameState[cond[1]] === gameState[cond[2]]) { 
            roundWon = true; break; 
        }
    }

    if(roundWon) {
        isGameActive = false;
        if(player1.sign === currentPlayer) player1.score++; else player2.score++;
        refreshScoreboard();
        
        if (player1.score === maxWinningRounds || player2.score === maxWinningRounds) {
            const winner = player1.score === maxWinningRounds ? player1 : player2;
            
            if (isMultiplayerOnline) {
                if (amIRoomHost) {
                    handleFinalGameVictory(winner);
                } else {
                    showVictoryPopupOnly(winner);
                }
            } else {
                
                handleFinalGameVictory(winner);
            }
        } else {
            triggerRoundTransition(player1.sign === currentPlayer ? player1.name : player2.name);
        }
        return;
    }
            }
            if(!gameState.includes("")) { isGameActive = false; triggerRoundTransition("Remis"); }
            else { currentPlayer = currentPlayer === 'X' ? 'O' : 'X'; updateStatusText(); }
        }

        function triggerRoundTransition(res) {
            currentRoundNumber++;
            document.getElementById('next-round-title').textContent = `Runda ${currentRoundNumber}`;
            document.getElementById('next-round-sub').innerHTML = res === "Remis" ? `Ostatnio: <strong style="color:#f59e0b;">Remis</strong>` : `Rundę wygrał: <strong>${res.toUpperCase()}</strong>`;
            document.getElementById('next-round-screen').style.display = 'flex';
            setTimeout(() => {
                gameState = ["", "", "", "", "", "", "", "", ""];
                cells.forEach(c => { c.textContent = ""; c.className = "cell"; });
                currentPlayer = 'X'; updateStatusText();
                document.getElementById('next-round-screen').style.display = 'none'; isGameActive = true;
            }, 1800);
        }

        // ZAPIS WYGRANEJ DO CENTRALNEJ BAZY SQL CLOUD
        async function handleFinalGameVictory(winner) {
            if(winner.name.toLowerCase() === loggedUser.username) {
                // Zwiększamy liczbę wygranych w SQL o 1 przy użyciu komendy RPC/Increment Supabase
                const { data } = await _supabase.rpc('increment_wins', { row_username: loggedUser.username });
                
                // Jeśli funkcja rpc nie jest ustawiona, robimy klasyczny bezpieczny update SQL:
                if(!data) {
                    await _supabase.from('users').update({ wins: loggedUser.wins + 1 }).eq('username', loggedUser.username);
                }
            }
            const th = themeSelect.value;
            document.getElementById('popup-symbol').textContent = th === 'aggressive' ? '😈🔥' : th === 'competition' ? '👑🏆' : '🐱🎉';
            document.getElementById('popup-text').innerHTML = `MISTRZ: ${winner.name.toUpperCase()}!`;
            document.getElementById('popup-subtext').innerHTML = `Seria zakończona wynikiem <strong>${player1.score} : ${player2.score}</strong>.`;
            document.getElementById('win-overlay').style.display = 'flex'; startConfetti();
        }

        // AKTUALIZACJA RANKINGU SALI SŁAW Z BAZY SQL
        async function updateLeaderboardUI() {
            const tbody = document.getElementById('leaderboard-tbody'); tbody.innerHTML = '';
            
            // Pobieranie danych z PostgreSQL posortowanych od największej liczby punktów
            const { data: sorted, error } = await _supabase.from('users').select('*').order('wins', { ascending: false }).limit(10);
            
            if(!sorted || sorted.length === 0) { tbody.innerHTML = '<tr><td colspan="3" class="no-records">Brak zarejestrowanych graczy w bazie SQL.</td></tr>'; return; }
            sorted.forEach((p, i) => {
                let place = i + 1; if(i===0) place='🥇'; if(i===1) place='🥈'; if(i===2) place='🥉';
                const r = document.createElement('tr');
                r.innerHTML = `<td style="font-weight:bold;">${place}</td><td>${p.avatar} ${p.username} <span style="color:#64748b; font-size:0.8rem;">#${p.id}</span></td><td style="font-weight:bold; color:#16a34a;">${p.wins}</td>`;
                tbody.appendChild(r);
            });
        }

        function startConfetti() {
            confettiInterval = setInterval(() => {
                const c = document.createElement('div'); c.classList.add('confetti'); c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = ['#ef4444','#22c55e','#3b82f6','#f59e0b','#ec4899'][Math.floor(Math.random()*5)];
                document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
            }, 70);
        }

        function backToMenu() {
            clearInterval(confettiInterval); document.querySelectorAll('.confetti').forEach(e => e.remove());
            document.getElementById('win-overlay').style.display = 'none'; gameScreen.style.display = 'none';
            if (isMultiplayerOnline && netConnection) netConnection.send({ type: 'rematch' });
            executeRematchReset();
        }

        function executeRematchReset() {
            gameState = ["", "", "", "", "", "", "", "", ""];
            cells.forEach(c => { c.textContent = ""; c.className = "cell"; });
            isGameActive = true; 
            if(isMultiplayerOnline) { document.getElementById('join-existing-room-area').style.display = "block"; }
            refreshUserSession(); handleGameModeChange();
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({path:cleanUrl}, '', cleanUrl);
        }

        cells.forEach(c => c.addEventListener('click', handleCellClick));
        document.getElementById('reset-btn').addEventListener('click', () => { if(isMultiplayerOnline && netConnection) netConnection.close(); backToMenu(); });
        document.getElementById('popup-close-btn').addEventListener('click', backToMenu);
        authScreen.style.display = 'block';
    </script>
</body>
</html>
